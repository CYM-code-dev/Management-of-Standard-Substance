    function bbcdRecalcRow(tr) {
        const src = tr._src;
        const qtyEl = tr.querySelector('.bbcd-c-qty');
        if (!qtyEl) return; // 工作液模式下没有此元素
        const qty = parseFloat(qtyEl.value);
        const volEl = document.getElementById('bbcdVolume');
        if (!volEl) return;
        const vol = parseFloat(volEl.value);
        const cell = tr.querySelector('.bbcd-c-conc');
        qtyEl.classList.remove('is-invalid');
        if (!isNaN(qty) && (qty <= 0 || qty > src.constantVolume + 1e-9)) {
            qtyEl.classList.add('is-invalid');
        }
        if (!qty || !vol || qty <= 0 || vol <= 0 || isNaN(src.concValue)) {
            cell.textContent = '—';
            return;
        }
        const c = src.concValue * qty / vol;
        cell.textContent = bbcdFmtConc(c);
    }

    function bbcdRecalcAll() {
        document.querySelectorAll('#bbcdConfigTable tbody tr').forEach(bbcdRecalcRow);
        bbcdUpdateValidity();
        bbcdUpdateCode();
        bbcdCheckValidity();
    }

    // 工作液浓度计算
    function bbcdRecalcWorkingSolution() {
        const count = window.bbcdCurrentDilutionCount || 5;
        const rows = [...document.querySelectorAll('#bbcdConfigTable tbody tr')];
        const dilutionVols = [];

        // 读取所有稀释体积
        for (let i = 0; i < count; i++) {
            const el = document.querySelector(`.bbcd-dilution-vol[data-idx="${i}"]`);
            dilutionVols.push(parseFloat(el?.value) || 0);
        }

        // 读取逐级稀释开关状态
        const isGradual = document.getElementById('bbcdGradualDilution')?.checked || false;

        rows.forEach(tr => {
            const src = tr._src;
            if (!src) return;

            const qtyInputs = tr.querySelectorAll('.bbcd-d-qty');
            const concCells = tr.querySelectorAll('.bbcd-d-conc');

            let prevConc = src.concValue; // 初始浓度为源浓度

            for (let i = 0; i < count; i++) {
                const qty = parseFloat(qtyInputs[i]?.value) || 0;
                const vol = dilutionVols[i];

                if (qty > 0 && vol > 0) {
                    if (isGradual) {
                        // 逐级稀释：从上一个稀释点的浓度计算
                        const conc = prevConc * qty / vol;
                        concCells[i].textContent = bbcdFmtConc(conc);
                        prevConc = conc; // 更新为当前浓度，供下一个稀释点使用
                    } else {
                        // 平行稀释：都从源浓度计算
                        const conc = src.concValue * qty / vol;
                        concCells[i].textContent = bbcdFmtConc(conc);
                    }
                } else {
                    concCells[i].textContent = '—';
                    if (isGradual) prevConc = 0; // 如果某个点无效，后续点也无法计算
                }
            }
        });

        // 更新自编号
        bbcdUpdateCode();
    }

    function bbcdUpdateValidity() {
        const rows = [...document.querySelectorAll('#bbcdConfigTable tbody tr')];
        if (!rows.length || !rows[0]._src) return;

        const solType = document.getElementById('bbcdSolType').value;
        const isWorkingSolution = (solType === 'SOLUTION_TYPE_D');
        const solName = (document.getElementById('bbcdSolutionName').value || '').toUpperCase();

        let minConc = null;
        if (!isWorkingSolution) {
            const volEl = document.getElementById('bbcdVolume');
            if (!volEl) return;
            const vol = parseFloat(volEl.value);
            const concs = rows.map(tr => {
                const qtyEl = tr.querySelector('.bbcd-c-qty');
                if (!qtyEl) return null;
                const qty = parseFloat(qtyEl.value);
                if (!qty || !vol || qty <= 0 || vol <= 0 || isNaN(tr._src.concValue)) return null;
                return tr._src.concValue * qty / vol;
            }).filter(c => c != null);
            minConc = concs.length ? Math.min(...concs) : null;
        }

        let days;
        if (solName.includes('偶氮') || solName.includes('AZO')) days = 30;
        else if (isWorkingSolution) days = 30;
        else if (minConc != null && minConc > 1000) days = 365;
        else if (minConc != null && minConc >= 500) days = 180;
        else days = 90;

        const expiry = new Date();
        expiry.setDate(expiry.getDate() + days);
        const srcEarliest = rows.map(tr => tr._src.validityDate).filter(Boolean).sort()[0];
        if (srcEarliest) {
            const srcExp = new Date(srcEarliest);
            if (expiry > srcExp) expiry.setTime(srcExp.getTime());
        }
        document.getElementById('bbcdValidityDate').value = expiry.toISOString().slice(0,10);
    }

    function bbcdCheckValidity() {
        const rows = [...document.querySelectorAll('#bbcdConfigTable tbody tr')];
        const dataRows = rows.filter(tr => tr._src);
        if (!rows.length || !dataRows.length) {
            document.getElementById('bbcdSaveBtn').disabled = true;
            document.getElementById('bbcdExportBtn').disabled = true;
            return;
        }

        const solType = document.getElementById('bbcdSolType').value;
        document.getElementById('bbcdSaveBtn').disabled = false;
        document.getElementById('bbcdExportBtn').disabled = false;

        // 有效期提示
        const validity = document.getElementById('bbcdValidityDate').value;
        const hint = document.getElementById('bbcdValidityHint');
        if (validity) {
            const tooLate = dataRows.filter(tr => tr._src.validityDate && tr._src.validityDate < validity);
            if (tooLate.length) {
                hint.textContent = `提示：以下源储备液的有效期早于本次有效期：${tooLate.map(tr => tr._src.configureOrder).join(', ')}`;
                hint.style.display = 'block';
            } else { hint.style.display = 'none'; }
        } else { hint.style.display = 'none'; }
        // 工作液固定有效期提示
        if (solType === 'SOLUTION_TYPE_D') {
            if (!hint.querySelector('.bbcd-d-hint')) {
                const span = document.createElement('span');
                span.className = 'bbcd-d-hint text-info d-block';
                span.textContent = '工作液有效期上限为 30 天';
                hint.appendChild(span);
                hint.style.display = 'block';
            }
        } else {
            hint.querySelector('.bbcd-d-hint')?.remove();
        }
    }

    function bbcdValidate() {
        let ok = true;
        const solType = document.getElementById('bbcdSolType').value;
        const isWorkingSolution = (solType === 'SOLUTION_TYPE_D');

        // 通用必填字段
        const required = ['bbcdSolutionName','bbcdSolutionCode','bbcdConfigureDate','bbcdValidityDate','bbcdTemp','bbcdHumid','bbcdStorage'];
        // B/C 类型额外需要定容体积和溶剂
        if (!isWorkingSolution) {
            required.push('bbcdVolume', 'bbcdMedium');
        }
        required.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            const v = (el.value || '').trim();
            if (!v) { el.classList.add('is-invalid'); ok = false; }
            else { el.classList.remove('is-invalid'); }
        });

        const rows = [...document.querySelectorAll('#bbcdConfigTable tbody tr')];
        if (!rows.length || (rows.length === 1 && rows[0].querySelector('td[colspan]'))) ok = false;

        if (isWorkingSolution) {
            const count = window.bbcdCurrentDilutionCount || 0;
            if (count < 1 || count > 12) {
                alert('请先生成有效的稀释点（1-12个）');
                ok = false;
            }
            // 验证稀释体积
            for (let i = 0; i < count; i++) {
                const el = document.querySelector(`.bbcd-dilution-vol[data-idx="${i}"]`);
                if (!el) continue;
                const v = parseFloat(el.value);
                if (!v || v <= 0) { el.classList.add('is-invalid'); ok = false; }
                else { el.classList.remove('is-invalid'); }
            }
            // 验证移取体积
            rows.forEach(tr => {
                if (!tr._src) return;
                tr.querySelectorAll('.bbcd-d-qty').forEach(input => {
                    const qty = parseFloat(input.value);
                    if (!qty || qty <= 0) { input.classList.add('is-invalid'); ok = false; }
                    else { input.classList.remove('is-invalid'); }
                });
            });
        } else {
            // B/C 类型的现有验证
            rows.forEach(tr => {
                const qtyEl = tr.querySelector('.bbcd-c-qty');
                if (!qtyEl) return;
                const qty = parseFloat(qtyEl.value);
                if (!qty || qty <= 0 || qty > tr._src.constantVolume + 1e-9) {
                    qtyEl.classList.add('is-invalid'); ok = false;
                } else { qtyEl.classList.remove('is-invalid'); }
                // 计算浓度必须有值
                const concEl = tr.querySelector('.bbcd-c-conc');
                if (!concEl || !concEl.textContent.trim() || concEl.textContent.trim() === '—') ok = false;
            });
        }
        return ok;
    }

    function bbcdBuildPayload() {
        const rows = [...document.querySelectorAll('#bbcdConfigTable tbody tr')];
        const volume = bbcdRoundVol(parseFloat(document.getElementById('bbcdVolume').value));
        const volStr = bbcdFmtVol(volume);
        const nowStr = new Date().toISOString().slice(0,19).replace('T',' ');
        const medium = document.getElementById('bbcdMedium').value.trim();

        const concParts = [], orderParts = [], controlledParts = [];
        const detailList = rows.map((tr, idx) => {
            const src = tr._src;
            const qty = bbcdRoundQty(parseFloat(tr.querySelector('.bbcd-c-qty').value));
            const qtyStr = bbcdFmtQty(qty);
            const c = bbcdRoundConc(src.concValue * qty / volume);
            const concStr = bbcdFmtConc(c);
            concParts.push(`${src.solutionName}:${concStr}(${src.concUnit})`);
            orderParts.push(src.configureOrder);
            controlledParts.push(src.controlledNo || '');
            return {
                id: null, createDatetime: nowStr, serialVersionUID: null,
                configureId: null,
                originalId: src.id,
                originalCode: src.originalCode,
                originalName: src.solutionName,
                originalConcentration: src.concentrationRaw,
                concentrationCount: src.concentrationRaw,
                originalUnit: null,
                receivedQuantity: qtyStr, receivedUint: 'mL',
                useUantity: qtyStr, useUnit: 'mL',
                medium: medium,
                volume: volStr, unit: 'mL',
                configurationConcentration: concStr,
                configurationUnit: src.concUnit,
                configurationUncertainty: null, remark: null,
                consumableReceive: null,
                dataid: src.id,
                configurationRecordId: null, creatorName: null, creatorId: null,
                modifierName: null, modifyDatetime: nowStr,
                originalNo: `${src.configureOrder}\n${src.solutionCode}`,
                _X_ID: `row_${Date.now() + idx}`,
            };
        });

        const earliestValidity = rows.map(tr => tr._src.validityDate).filter(Boolean).sort()[0] || '';

        return {
            id: null, createDatetime: nowStr, serialVersionUID: null,
            solutionName: document.getElementById('bbcdSolutionName').value.trim(),
            solutionCode: document.getElementById('bbcdSolutionCode').value.trim(),
            deviceIds: null, deviceNames: null,
            configureDate: document.getElementById('bbcdConfigureDate').value,
            validityDate: document.getElementById('bbcdValidityDate').value,
            storageCondition: document.getElementById('bbcdStorage').value || null,
            storageLocation: '4-1-华业4-1',
            concentration: concParts.join(';'),
            concentrationCount: concParts.join(';'),
            concentrationUnitName: null, uncertainty: null, configureOrder: null,
            originalCode: orderParts.join(','),
            controlledNo: controlledParts.join(','),
            medium: null, configuratorId: null,
            solutionType: document.getElementById('bbcdSolType').value,
            configuratorName: null,
            constantVolume: 0, totalConstantVolume: 0, usedConstantVolume: 0,
            remark: null, diluteStatus: false,
            consumableReceive: null,
            customType: document.getElementById('bbcdCustomType').value.trim() || null,
            auditUserName: null, auditTime: null,
            diluteConcentrationControl: '[]',
            pageType: 'SOLUTION_TYPE_B',
            saveDetailList: JSON.stringify(detailList),
            originalValidityDate: earliestValidity,
            configurationTemplateId: null, intermediateTemplateId: null,
            temperature: document.getElementById('bbcdTemp').value.trim(),
            humidity: document.getElementById('bbcdHumid').value.trim(),
            computingFormula: null, configurationMethod: null,
            configurationProcess: null, nextAuditUserName: null,
            disposeUserName: null, disposeTime: null, disposeWay: null,
            configurationSolutionTemplateId: null, configurationRecordId: null,
            creatorName: null, creatorId: null, modifierName: null,
            modifyDatetime: nowStr,
            receivedUint: 'mL',
        };
    }

    // 辅助函数：将索引转换为字段名（0 -> 'dilutionOne', 1 -> 'dilutionTwo', ...）
    function bbcdGetDilutionFieldName(index) {
        const names = ['dilutionOne', 'dilutionTwo', 'dilutionThree', 'dilutionFour',
                       'dilutionFive', 'dilutionSix', 'dilutionSeven', 'dilutionEight',
                       'dilutionNine', 'dilutionTen', 'dilutionEleven', 'dilutionTwelve'];
        return names[index] || null;
    }

    // 构建工作液 payload
    function bbcdBuildWorkingSolutionPayload() {
        const count = window.bbcdCurrentDilutionCount || 5;
        const tbody = document.querySelector('#bbcdConfigTable tbody');
        const rows = [...tbody.querySelectorAll('tr')];
        const nowStr = new Date().toISOString().slice(0,19).replace('T',' ');
        const dilutionVols = [];

        // 从表格第一行读取所有稀释体积
        const firstRow = rows[0];
        for (let i = 0; i < count; i++) {
            const el = firstRow?.querySelector(`.bbcd-dilution-vol[data-idx="${i}"]`);
            dilutionVols.push(parseFloat(el?.value) || 0);
        }

        // 过滤掉第一行（定容体积行），只处理数据行

                modifierName: null, modifyDatetime: nowStr,

            }
            saveDetailList.push(row);

        // 2. 定容体积行

            configureId: null, originalId: null,
            originalCode: null, originalName: null,
            originalConcentration: null, concentrationCount: null, originalUnit: null,

            remark: null, dataSeq: dataSeq++,
            receivedQuantity: 0, receivedUint: null, medium: null,
            consumableReceive: null, configurationProcess: null,
            configurationRecordId: null, creatorName: null, creatorId: null,
            modifierName: null, modifyDatetime: nowStr,
        };
        for (let i = 0; i < count; i++) {
            const fieldName = bbcdGetDilutionFieldName(i);
            if (fieldName) volumeRow[fieldName] = String(dilutionVols[i]);
        }
        saveDetailList.push(volumeRow);

        // 3. 浓度行（每个物质一行，从显示文本读取，originalId 对应源储备液）
        dataRows.forEach(tr => {
            const src = tr._src;
            if (!src) return;
            const concCells = tr.querySelectorAll('.bbcd-d-conc');
            const qtyInputs = tr.querySelectorAll('.bbcd-d-qty');
            const row = {
                id: null, createDatetime: nowStr, serialVersionUID: null,
                configureId: null, originalId: src.id,
                originalCode: src.configureOrder,
                originalName: src.solutionName,
                originalConcentration: src.concentrationRaw,
                concentrationCount: src.concentrationRaw,
                originalUnit: src.concUnit,
                groupName: src.solutionName,
                groupUnit: src.concUnit,
                dilutionSix: null, dilutionSeven: null, dilutionEight: null,
                dilutionNine: null, dilutionTen: null, dilutionEleven: null, dilutionTwelve: null,
                remark: null, dataSeq: dataSeq++,
                receivedQuantity: qtyInputs[0]?.value || '1',
                receivedUint: 'mL',
                medium: document.getElementById('bbcdMedium')?.value.trim() || null,
                consumableReceive: null, configurationProcess: null,
                configurationRecordId: null, creatorName: null, creatorId: null,
                modifierName: null, modifyDatetime: nowStr,
            };
            for (let i = 0; i < count; i++) {
                const fieldName = bbcdGetDilutionFieldName(i);
                if (fieldName) row[fieldName] = concCells[i]?.textContent.trim() || '';
            }
            saveDetailList.push(row);
        });

        const originalCodes = dataRows.map(tr => tr._src?.configureOrder).filter(Boolean).join(',');
        const controlledNos = dataRows.map(tr => tr._src?.controlledNo).filter(Boolean).join(',');

        return {
            id: null, createDatetime: nowStr, serialVersionUID: null,
            solutionName: document.getElementById('bbcdSolutionName').value.trim(),
            solutionCode: document.getElementById('bbcdSolutionCode').value.trim(),
            deviceIds: null, deviceNames: null,
            configureDate: document.getElementById('bbcdConfigureDate').value,
            validityDate: document.getElementById('bbcdValidityDate').value,
            storageCondition: document.getElementById('bbcdStorage').value || null,
            storageLocation: '4-1-华业4-1',
            concentration: null, concentrationCount: null,
            concentrationUnitName: null, uncertainty: null, configureOrder: null,
            originalCode: originalCodes,
            controlledNo: controlledNos,
            medium: document.getElementById('bbcdMedium')?.value.trim() || null,
            configuratorId: null,
            solutionType: 'SOLUTION_TYPE_D',
            configuratorName: null,
            constantVolume: 0, totalConstantVolume: 0, usedConstantVolume: 0,
            remark: null, diluteStatus: true,
            consumableReceive: null,
            customType: document.getElementById('bbcdCustomType').value.trim() || null,
            auditUserName: null, auditTime: null,
            diluteConcentrationControl: '[]',
            pageType: 'SOLUTION_TYPE_B',
            saveDetailList: JSON.stringify(saveDetailList),
            configurationTemplateId: null, intermediateTemplateId: null,
            temperature: document.getElementById('bbcdTemp').value.trim(),
            humidity: document.getElementById('bbcdHumid').value.trim(),
            computingFormula: null, configurationMethod: null,
            configurationProcess: null, nextAuditUserName: null,
            disposeUserName: null, disposeTime: null, disposeWay: null,
            configurationSolutionTemplateId: null, configurationRecordId: null,
            creatorName: null, creatorId: null, modifierName: null,
            modifyDatetime: nowStr,
            receivedUint: 'mL',
        };
    }

    function bbcdBuildExportPayload() {
        const rows = [...document.querySelectorAll('#bbcdConfigTable tbody tr')];
        const volume = bbcdRoundVol(parseFloat(document.getElementById('bbcdVolume').value));
        const volStr = bbcdFmtVol(volume);
        const medium = document.getElementById('bbcdMedium').value.trim();
        const detailList = rows.map(tr => {
            const src = tr._src;
            const qty = bbcdRoundQty(parseFloat(tr.querySelector('.bbcd-c-qty').value));
            const c = bbcdRoundConc(src.concValue * qty / volume);
            return {
                originalName: src.solutionName,
                originalConcentration: src.concentrationRaw,
                receivedQuantity: bbcdFmtQty(qty),
                medium: medium,
                volume: volStr,
                configurationConcentration: bbcdFmtConc(c),
                configurationUnit: src.concUnit,
                originalNo: `${src.configureOrder}\n${src.solutionCode}`,
            };
        });
        return {
            solution_name:     document.getElementById('bbcdSolutionName').value.trim(),
            solution_code:     document.getElementById('bbcdSolutionCode').value.trim(),
            configure_date:    document.getElementById('bbcdConfigureDate').value,
            validity_date:     document.getElementById('bbcdValidityDate').value,
            temperature:       document.getElementById('bbcdTemp').value.trim(),
            humidity:          document.getElementById('bbcdHumid').value.trim(),
            storage_condition: document.getElementById('bbcdStorage').value || '',
            custom_type:       document.getElementById('bbcdCustomType').value.trim(),
            detail_list:       detailList,
        };
    }

    async function bbcdExport() {
        if (!bbcdValidate()) return;
        const btn = document.getElementById('bbcdExportBtn');
        const orig = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>生成中...';
        let ok = false;
        try {
            const resp = await fetch('/api/lims/export_bbcd_docx', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(bbcdBuildExportPayload()),
            });
            if (!resp.ok) {
                const err = await resp.json().catch(() => ({message: resp.statusText}));
                alert('导出失败: ' + (err.message || resp.statusText));
                return;
            }
            const blob = await resp.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const cd = resp.headers.get('Content-Disposition') || '';
            const m = cd.match(/filename\*?=(?:UTF-8'')?["']?([^"';\r\n]+)/i);
            a.download = m ? decodeURIComponent(m[1]) : '配制记录.docx';
            a.href = url;
            a.click();
            URL.revokeObjectURL(url);
            ok = true;
        } catch (e) {
            alert('导出异常: ' + e.message);
        } finally {
            btn.disabled = false;
            if (ok) {
                btn.className = 'btn btn-sm btn-success';
                btn.innerHTML = '<i class="fas fa-check me-1"></i>已导出';
            } else {
                btn.innerHTML = orig;
            }
        }
    }

    async function bbcdSave() {
        if (!bbcdValidate()) return;
        const btn = document.getElementById('bbcdSaveBtn');
        const orig = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>保存中...';
        try {
            // 检测类型并选择接口/payload
            const solType = document.getElementById('bbcdSolType').value;
            const isWorkingSolution = (solType === 'SOLUTION_TYPE_D');

            const endpoint = isWorkingSolution
                ? 'http://192.168.12.234:60015/detectionManager/manager/dtSolutionConfigure/saveSolutionConfigure'
                : '/api/lims/save_solution_b';

            const payload = isWorkingSolution
                ? bbcdBuildWorkingSolutionPayload()
                : bbcdBuildPayload();

            const resp = await fetch(endpoint, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await resp.json();
            if (!data.success) {
                btn.innerHTML = orig;
                btn.disabled = false;
                alert('保存失败: ' + (data.message || '未知错误'));
                return;
            }
            btn.classList.remove('btn-primary');
            btn.classList.add('btn-success');
            btn.innerHTML = '<i class="fas fa-check me-1"></i>已保存';
            // 清除保存的选中状态，因为已成功保存
            bbcdSelectedIndices = [];
            await bbcdQuery();
            bootstrap.Modal.getOrCreateInstance(document.getElementById('bbcdConfigModal')).hide();
        } catch (e) {
            btn.innerHTML = orig;
            btn.disabled = false;
            alert('保存异常: ' + e.message);
        }
    }

            const checkedIdxs = [...document.querySelectorAll('.bbcd-row-check:checked')]
                .map(c => parseInt(c.dataset.idx, 10));
            if (!checkedIdxs.length) return;
            const detectType = item => {
                if (!item) return '';
                const order = String(item.configureOrder || '').toUpperCase();
                if (order.startsWith('B-')) return 'SOLUTION_TYPE_B';
                if (order.startsWith('C-')) return 'SOLUTION_TYPE_C';
                return item.type || item.solutionType || '';
            };
            const types = checkedIdxs.map(i => detectType(bbcdLastResults[i])).filter(Boolean);
            const hasB = types.includes('SOLUTION_TYPE_B');
            const hasC = types.includes('SOLUTION_TYPE_C');
            const allowB = hasB && !hasC;
            const allowC = true;
            const allowD = true;
            const btnB = document.querySelector('.bbcd-type-pick[data-type="SOLUTION_TYPE_B"]');
            const btnC = document.querySelector('.bbcd-type-pick[data-type="SOLUTION_TYPE_C"]');
            const btnD = document.querySelector('.bbcd-type-pick[data-type="SOLUTION_TYPE_D"]');
            if (btnB) btnB.disabled = !allowB;
            if (btnC) btnC.disabled = !allowC;
            if (btnD) btnD.disabled = !allowD;
            const cntB = types.filter(t => t === 'SOLUTION_TYPE_B').length;
            const cntC = types.filter(t => t === 'SOLUTION_TYPE_C').length;
            let srcLabel = '源液';
            if (hasB && !hasC) srcLabel = '储备液 B';
            else if (!hasB && hasC) srcLabel = '应用液 C';
            else if (hasB && hasC) srcLabel = `源液（B:${cntB} / C:${cntC}）`;
            document.getElementById('bbcdTypePickerSrcLabel').textContent = srcLabel;
            document.getElementById('bbcdTypePickerCount').textContent = checkedIdxs.length;
            // 动态更新类型按钮说明文字
            const spanB = btnB && btnB.querySelector('span.small.text-muted');
            const spanC = btnC && btnC.querySelector('span.small.text-muted');
            const spanD = btnD && btnD.querySelector('span.small.text-muted');
            if (spanB) spanB.textContent = '— 储备液 B → 储备液 B';
            if (spanC) {
                if (hasB && !hasC) spanC.textContent = '— 储备液 B → 应用液 C';
                else if (!hasB && hasC) spanC.textContent = '— 应用液 C → 应用液 C';
                else spanC.textContent = '— 混合 → 应用液 C';
            }
            if (spanD) {
                if (hasB && !hasC) spanD.textContent = '— 储备液 B → 工作液 D';
                else if (!hasB && hasC) spanD.textContent = '— 应用液 C → 工作液 D';

            }

        });

                    bbcdCheckValidity();

                if (e.target.id === 'bbcdVolume') {
                    bbcdRecalcAll();

                    bbcdRecalcRow(e.target.closest('tr'));
                    bbcdUpdateValidity();
                    bbcdCheckValidity();
                }
            }

        document.addEventListener('input', e => {

                bbcdRecalcWorkingSolution();
                bbcdUpdateValidity();
                bbcdCheckValidity();
            }
        });

        // 为"生成稀释点"按钮添加监听器
        document.getElementById('bbcdGenerateDilutionBtn')?.addEventListener('click', bbcdGenerateDilutionPoints);

        // 为"重置"按钮添加监听器
        document.getElementById('bbcdResetWorkingSolutionBtn')?.addEventListener('click', bbcdResetWorkingSolution);

        // 为逐级稀释开关添加监听器

                bbcdRecalcWorkingSolution();
                bbcdCheckValidity();
            }
        });

        document.querySelector('#bbcdConfigTable tbody').addEventListener('blur', e => {
            const t = e.target;
            const v = parseFloat(t.value);
            if (!isFinite(v) || v <= 0) return;

            if (t.id === 'bbcdVolume') {
                t.value = bbcdFmtVol(bbcdRoundVol(v));
                bbcdRecalcAll();
            } else if (t.classList.contains('bbcd-c-qty')) {
                t.value = bbcdFmtQty(bbcdRoundQty(v));
                bbcdRecalcRow(t.closest('tr'));
                bbcdCheckValidity();
            } else if (t.classList.contains('bbcd-dilution-vol')) {
                // 工作液的定容体积：使用体积格式化（有效数字规则）
                t.value = bbcdFmtVol(bbcdRoundVol(v));
                if (document.getElementById('bbcdSolType').value === 'SOLUTION_TYPE_D') {
                    bbcdRecalcWorkingSolution();
                    bbcdCheckValidity();
                }
            } else if (t.classList.contains('bbcd-d-qty')) {
                // 工作液的移取体积：保留2位小数
                t.value = bbcdFmtQty(bbcdRoundQty(v));
                if (document.getElementById('bbcdSolType').value === 'SOLUTION_TYPE_D') {
                    bbcdRecalcWorkingSolution();
                    bbcdCheckValidity();
