<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标准物质配置</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        *,*::before,*::after { box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #eef2ff;
            background-image:
                radial-gradient(ellipse 600px 400px at 10% 20%, rgba(99,102,241,0.12) 0%, transparent 70%),
                radial-gradient(ellipse 500px 500px at 85% 60%, rgba(59,130,246,0.10) 0%, transparent 70%),
                radial-gradient(ellipse 400px 300px at 50% 90%, rgba(139,92,246,0.08) 0%, transparent 70%);
            font-family: 'DM Sans', 'Segoe UI', sans-serif;
            font-size: 13px;
            font-weight: 400;
            line-height: 1.65;
            color: #111827;
        }

        h2.fw-bold {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #111827, #6366F1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card, .glass-card {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 10px;
            transition: transform 0.25s, box-shadow 0.25s;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3B82F6, #6366F1);
            opacity: 0;
            transition: opacity 0.25s;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(99,102,241,0.10);
        }
        .card:hover::before { opacity: 1; }
        .card-body { padding: 0.85rem 1rem; }

        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(255,255,255,0.55);
            border-bottom: 1px solid rgba(255,255,255,0.7);
            padding: 0.6rem 1.2rem;
            margin-bottom: 1rem;
        }

        .btn {
            font-size: 0.78rem;
            font-weight: 500;
            padding: 0.35rem 0.85rem;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-primary {
            background-color: #3B82F6;
            border-color: #3B82F6;
            box-shadow: 0 4px 14px rgba(59,130,246,0.4);
        }
        .btn-primary:hover {
            background-color: #2563EB;
            border-color: #2563EB;
            box-shadow: 0 6px 20px rgba(59,130,246,0.45);
        }
        .btn-outline-primary {
            color: #3B82F6;
            border-color: #3B82F6;
        }
        .btn-outline-primary:hover {
            background-color: #3B82F6;
            border-color: #3B82F6;
            box-shadow: 0 4px 14px rgba(59,130,246,0.35);
        }
        .btn-outline-secondary {
            color: #6B7280;
            border-color: #d1d5db;
        }
        .btn-outline-secondary:hover {
            background: rgba(107,114,128,0.08);
            border-color: #9ca3af;
            color: #374151;
        }

        .form-label { font-size: 0.75rem; margin-bottom: 0.2rem; font-weight: 500; color: #6B7280; }
        .form-control, .form-select {
            font-size: 0.78rem;
            font-family: 'DM Sans', 'Segoe UI', sans-serif;
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background: rgba(255,255,255,0.7);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-select option {
            font-family: 'DM Sans', 'Segoe UI', sans-serif;
            font-size: 0.78rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }

        .table { font-size: 0.78rem; }
        .table thead th {
            font-size: 0.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3B82F6, #6366F1);
            color: white;
            padding: 0.55rem 0.45rem;
            border: none;
        }
        .table td {
            padding: 0.45rem 0.4rem;
            vertical-align: middle;
            border-color: #f3f4f6;
        }
        .table-responsive {
            max-height: 68vh;
            border-radius: 10px;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.7);
            overflow: auto;
        }
        .action-icons i { font-size: 0.9rem; cursor: pointer; margin: 0 4px; transition: transform 0.15s; }
        .action-icons i:hover { transform: scale(1.15); }

        .badge { font-size: 0.65rem; font-weight: 500; border-radius: 6px; }
        .badge.bg-success { background-color: #3B82F6 !important; }
        .badge.bg-warning { background: linear-gradient(135deg, #f59e0b, #d97706) !important; color: #fff !important; }
        .badge.bg-secondary { background: #6366F1 !important; }
        #recordCount { font-size: 0.7rem; }

        .solution-config-icon {
            color: #0891b2;
            cursor: pointer;
            font-size: 0.8rem;
            flex-shrink: 0;
            transition: transform 0.15s;
        }
        .solution-config-icon:hover { transform: scale(1.2); }

        .cert-icon {
            color: #ef4444;
            margin-left: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: transform 0.2s, color 0.2s;
        }
        .cert-icon:hover { transform: scale(1.15); color: #dc2626; }
        .labno-cell { display: flex; align-items: center; justify-content: space-between; gap: 5px; width: 100%; }

        .login-bar {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .login-bar i { margin-right: 4px; color: #6366F1; }

        .modal-content {
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            overflow: hidden;
        }
        .modal-header.bg-primary {
            background: linear-gradient(135deg, #3B82F6, #6366F1) !important;
            border-bottom: none;
        }
        .modal-header.bg-info {
            background: linear-gradient(135deg, #3B82F6, #6366F1) !important;
            border-bottom: none;
        }
        .modal-header.bg-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            border-bottom: none;
        }
        .modal-body { padding: 1rem 1.2rem; }
        .modal-footer { border-top: 1px solid #f3f4f6; }
        .modal-footer .btn { padding: 0.3rem 0.75rem; }
        .modal-body .row.g-2 { --bs-gutter-y: 0.25rem; }
        .modal-body .row.g-2 > [class*="col-"] { margin-top: 0.1rem; }
        .modal-body .form-label { font-size: 0.75rem; }
        #loginModal .modal-dialog { max-width: 360px; }

        .captcha-img-modal {
            height: 38px;
            width: 100px;
            cursor: pointer;
            object-fit: contain;
            background: rgba(255,255,255,0.5);
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }

        .query-btn { white-space: nowrap; }

        .expired-row { background-color: rgba(229,231,235,0.5) !important; }
        .expired-row td { background-color: inherit !important; }

        .table-hover tbody tr:hover { background-color: rgba(59,130,246,0.08) !important; }
        .table-hover tbody tr:hover td { background-color: inherit !important; }

        #logoutBtn {
            border: none;
            background: transparent;
            color: #ef4444;
            font-size: 1rem;
            padding: 0.25rem 0.5rem;
            border-radius: 8px;
            transition: all 0.2s;
        }
        #logoutBtn:hover {
            color: #dc2626;
            background: rgba(239,68,68,0.08);
        }

        .highlight-input,
        .conc-unit-input {
            border-left: 3px solid #6366F1 !important;
            background: rgba(99,102,241,0.08) !important;
        }
        .highlight-input:focus,
        .conc-unit-input:focus {
            border-left: 3px solid #6366F1 !important;
            background: rgba(99,102,241,0.12) !important;
        }
        .conc-unit-badge {
            display: inline-block;
            background: #6366F1;
            color: #fff;
            font-size: 0.6rem;
            padding: 1px 6px;
            border-radius: 4px;
            margin-left: 4px;
            font-weight: 600;
            vertical-align: middle;
        }

        .custom-dropdown { position: relative; }
        .custom-dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 1050;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(12px);
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-top: 2px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            max-height: 180px;
            overflow-y: auto;
        }
        .custom-dropdown-menu.show { display: block; }
        .custom-dropdown-item {
            padding: 0.3rem 0.6rem;
            font-size: 0.78rem;
            font-family: 'DM Sans', 'Segoe UI', sans-serif;
            color: #111827;
            cursor: pointer;
            transition: background 0.15s;
        }
        .custom-dropdown-item:hover {
            background: rgba(59,130,246,0.1);
        }
        .duplicate-highlight {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
        }
        .sol-modal-tabs {
            border-bottom: 2px solid rgba(59,130,246,0.18);
            background: rgba(238,242,255,0.6);
            gap: 2px;
        }
        .sol-modal-tabs .nav-link {
            font-family: 'DM Sans','Segoe UI',sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: #6B7280;
            padding: 0.45rem 1.2rem;
            border-radius: 8px 8px 0 0;
            border: 1px solid transparent;
            border-bottom: none;
            background: transparent;
            transition: color .2s, background .2s, border-color .2s;
        }
        .sol-modal-tabs .nav-link:hover {
            color: #3B82F6;
            background: rgba(59,130,246,0.08);
            border-color: rgba(59,130,246,0.2) rgba(59,130,246,0.2) transparent;
        }
        .sol-modal-tabs .nav-link.active {
            color: #3B82F6;
            background: rgba(255,255,255,0.85);
            border-color: rgba(59,130,246,0.25) rgba(59,130,246,0.25) rgba(255,255,255,0.85);
        }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .bbcd-code-confirm { border-color: #22c55e !important; box-shadow: 0 0 0 3px rgba(34,197,94,0.2) !important; }

        /* 开关样式 */
        .onoffswitch {
            position: relative;
            width: 50px;
            display: inline-block;
            user-select: none;
        }
        .onoffswitch-checkbox {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .onoffswitch-switch {
            display: block;
            width: 50px;
            height: 24px;
            background-color: #ccc;
            border-radius: 24px;
            cursor: pointer;
            transition: background-color 0.3s;
            position: relative;
        }
        .onoffswitch-switch::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: white;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }
        .onoffswitch-checkbox:checked + .onoffswitch-switch {
            background-color: #3B82F6;
        }
        .onoffswitch-checkbox:checked + .onoffswitch-switch::before {
            transform: translateX(26px);
        }
    </style>
</head>
<body>
<div class="top-bar d-flex flex-wrap justify-content-between align-items-center">
    <div><h2 class="fw-bold mb-0"><i class="fas fa-vial me-2"></i>标准物质配置</h2></div>
    <div class="d-flex align-items-center gap-2">
        <button id="showLoginModalBtn" class="btn btn-outline-primary"><i class="fas fa-sign-in-alt me-1"></i>登录</button>
        <div id="userInfoBox" class="login-bar" style="display: none;">
            <i class="fas fa-user-circle"></i> <span id="displayUserName"></span>
            <button class="ms-2" id="logoutBtn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
        </div>
        <a href="/organic-std" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>有机标准品</a>
    </div>
</div>
<div class="container-fluid pb-3 px-3">

          <ul class="nav nav-tabs sol-modal-tabs px-3 pt-3" id="solModalTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="sol-ab-tab"
              data-bs-toggle="tab" data-bs-target="#abPane"
              type="button" role="tab" aria-controls="abPane" aria-selected="true">
              A-B
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="sol-bbcd-tab"
              data-bs-toggle="tab" data-bs-target="#bbcdPane"
              type="button" role="tab" aria-controls="bbcdPane" aria-selected="false">
              BC-BCD
            </button>
          </li>
        </ul>

  <div class="tab-content mt-0">
          <div class="tab-pane fade show active p-3" id="abPane" role="tabpanel" aria-labelledby="sol-ab-tab">
            <!-- LIMS 搜索区 -->
            <div class="card border-0 shadow-sm mb-3">
              <div class="card-body py-2">
                <div class="row g-2 align-items-end">
                  <div class="col-md-2">
                    <label class="form-label mb-1 small fw-bold">实验室编号</label>
                    <input type="text" id="solSearchLabNo" class="form-control form-control-sm" placeholder="实验室编号">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label mb-1 small fw-bold">名称</label>
                    <input type="text" id="solSearchName" class="form-control form-control-sm" placeholder="名称关键词">
                  </div>
                  <div class="col-md-2">
                    <label class="form-label mb-1 small fw-bold">CAS No.</label>
                    <input type="text" id="solSearchCas" class="form-control form-control-sm" placeholder="CAS 号">
                  </div>
                  <div class="col-md-2">
                    <label class="form-label mb-1 small fw-bold">使用部门</label>
                    <input type="text" id="solSearchOrg" class="form-control form-control-sm" placeholder="使用部门" list="solOrgList" autocomplete="off">
                    <datalist id="solOrgList">
                      <option value="日化实验室"></option>
                      <option value="食品接触材料实验室"></option>
                      <option value="消费品实验室"></option>
                    </datalist>
                  </div>
                  <div class="col-md-1">
                    <label class="form-label mb-1 small fw-bold">状态</label>
                    <select id="solSearchStatus" class="form-select form-select-sm">
                      <option value="normal" selected>正常</option>
                      <option value="overdue">过期</option>
                      <option value="history">历史</option>
                    </select>
                  </div>
                  <div class="col d-flex gap-1 align-items-end justify-content-end">
                    <button class="btn btn-sm btn-outline-secondary" id="solResetBtn" title="重置"><i class="fas fa-redo"></i></button>
                    <button class="btn btn-sm btn-primary" id="solSearchBtn" title="查询"><i class="fas fa-search"></i></button>
                  </div>
                </div>
                <div id="solSearchResults" class="mt-2" style="display:none;">
                  <div class="table-responsive" style="max-height:400px;overflow-y:auto;">
                    <table class="table table-sm table-bordered table-hover mb-0" id="solResultTable">
                      <thead class="table-light" style="position:sticky;top:0;z-index:1;">
                        <tr>
                          <th style="width:36px;"><input type="checkbox" id="solResultCheckAll"></th>
                          <th>实验室编号</th>
                          <th>名称</th>
                          <th>有机库存</th>
                          <th>CAS No.</th>
                          <th>浓度</th>
                          <th>规格/剩余量</th>
                          <th>购买日期</th>
                          <th>有效期</th>
                          <th>使用部门</th>
                        </thead> 
                      </thead>
                      <tbody id="solResultTbody"></tbody>
                    </table>
                  </div>
                  <div class="d-flex justify-content-between align-items-center mt-2">
                    <div class="small text-muted">已选中 <span id="solResultSelectedCount">0</span> 条</div>
                    <button class="btn btn-sm btn-success" id="solResultAddBtn" disabled><i class="fas fa-flask me-1"></i>配置选中项</button>
                  </div>
                </div>
              </div>
            </div>
            <!-- 选中标准品信息 -->
          </div>

          <!-- B-BCD Tab Pane: 从已配储备液 B 配制混合液 -->
          <div class="tab-pane fade p-3" id="bbcdPane" role="tabpanel" aria-labelledby="sol-bbcd-tab">
            <!-- 1.1 筛选区 -->
            <div class="card border-0 shadow-sm mb-3">
              <div class="card-body py-2">
                <div class="row g-2 align-items-end">
                  <div class="col-md-2">
                    <label class="form-label mb-1 small fw-bold">名称</label>
                    <input type="text" id="bbcdFilterName" class="form-control form-control-sm" placeholder="名称关键词">
                  </div>
                  <div class="col-md-2">
                    <label class="form-label mb-1 small fw-bold">自编号</label>
                    <input type="text" id="bbcdFilterCode" class="form-control form-control-sm" placeholder="自编号关键词">
                  </div>
                  <div class="col-md-1">
                    <label class="form-label mb-1 small fw-bold">类型</label>
                    <input type="text" id="bbcdFilterCustomType" class="form-control form-control-sm" list="bbcdFilterCustomTypeList" placeholder="可输入">
                    <datalist id="bbcdFilterCustomTypeList"></datalist>
                  </div>
                  <div class="col-md-1">
                    <label class="form-label mb-1 small fw-bold">配置人</label>
                    <input type="text" id="bbcdFilterOperator" class="form-control form-control-sm" list="bbcdFilterOperatorList" placeholder="可输入">
                    <datalist id="bbcdFilterOperatorList"></datalist>
                  </div>
                  <div class="col-md-1">
                    <label class="form-label mb-1 small fw-bold">BC类型</label>
                    <select id="bbcdFilterSolType" class="form-select form-select-sm">
                      <option value="">全部</option>
                      <option value="SOLUTION_TYPE_B">储备液 B</option>
                      <option value="SOLUTION_TYPE_C">应用液 C</option>
                    </select>
                  </div>
                  <div class="col-md-1">
                    <label class="form-label mb-1 small fw-bold">审核</label>
                    <select id="bbcdFilterAuditStatus" class="form-select form-select-sm">
                      <option value="">全部</option>
                      <option value="1">已审核</option>
                      <option value="0">未审核</option>
                    </select>
                  </div>
                  <div class="col-md-1">
                    <label class="form-label mb-1 small fw-bold">状态</label>
                    <select id="bbcdFilterConfigStatus" class="form-select form-select-sm">
                      <option value="0" selected>正常</option>
                      <option value="1">历史</option>
                    </select>
                  </div>
                  <div class="col-md-1">
                    <label class="form-label mb-1 small fw-bold">配置日期 起</label>
                    <input type="date" id="bbcdFilterDateFrom" class="form-control form-control-sm">
                  </div>
                  <div class="col-md-1">
                    <label class="form-label mb-1 small fw-bold">配置日期 止</label>
                    <input type="date" id="bbcdFilterDateTo" class="form-control form-control-sm">
                  </div>
                  <div class="col-md-1 d-flex gap-1 justify-content-end">
                    <button class="btn btn-sm btn-outline-secondary" id="bbcdResetFilterBtn" title="重置"><i class="fas fa-redo"></i></button>
                    <button class="btn btn-sm btn-primary" id="bbcdQueryBtn" title="查询"><i class="fas fa-search"></i></button>
                  </div>
                </div>
              </div>
            </div>
            <!-- 1.2 结果列表区 -->
            <div id="bbcdResultArea" class="mb-3">
              <div class="table-responsive" style="max-height:400px;overflow-y:auto;">
                <table class="table table-sm table-bordered table-hover mb-0" id="bbcdResultTable">
                  <thead class="table-light" style="position:sticky;top:0;z-index:1;">
                    <tr>
                      <th style="width:36px;"><input type="checkbox" id="bbcdCheckAll"></th>
                      <th>编号</th>
                      <th>自编号</th>
                      <th>名称</th>
                      <th>浓度</th>
                      <th>剩余(mL)</th>
                      <th>配置人</th>
                      <th>配置日期</th>
                      <th>有效期</th>
                      <th>审核</th>
                    </tr>
                  </thead>
                  <tbody><tr><td colspan="10" class="text-center text-muted small py-3">请先查询</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="d-flex justify-content-between align-items-center mt-2">
                <div class="small text-muted">已选 <span id="bbcdSelectedCount">0</span> 条</div>
                <button class="btn btn-sm btn-success" id="bbcdConfigBtn" disabled><i class="fas fa-flask me-1"></i>配置选中项</button>
              </div>
            </div>
            <!-- 1.3 配置区：移至独立模态框 #bbcdConfigModal，详见下方 -->
          </div>
  </div>


<!-- A-B 储备液配置弹窗 -->
<div class="modal fade" id="solConfigModal" tabindex="-1" aria-hidden="true">

<!-- 隐藏表单：用于触发浏览器密码保存 -->
<form id="savePasswordForm" method="post" action="/api/login" target="_self" style="display:none;">
    <input type="hidden" name="username" id="hiddenUsername">
    <input type="hidden" name="password" id="hiddenPassword">
    <input type="hidden" name="captcha" id="hiddenCaptcha">
    <input type="hidden" name="client_ua" id="hiddenClientUA">
    <input type="hidden" name="next" value="/solution-config">
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ---------- 登录相关变量 ----------
    let loginModalInstance = null;

    const showLoginBtn = document.getElementById('showLoginModalBtn');
    const userInfoBox = document.getElementById('userInfoBox');
    const displayUserNameSpan = document.getElementById('displayUserName');
    const logoutBtn = document.getElementById('logoutBtn');
    const captchaImg = document.getElementById('captchaImg');
    const togglePwdBtn = document.getElementById('togglePwdBtn');

    async function refreshCaptcha() {
        try {
            const resp = await fetch('/api/captcha');
            const data = await resp.json();
            if (data.success) captchaImg.src = data.image;
            else console.warn('获取验证码失败');
        } catch (e) { console.error('验证码请求异常', e); }
    }

    async function checkLoginStatus() {
        try {
            const resp = await fetch('/api/status', { credentials: 'include' });
            const data = await resp.json();
            if (data.logged_in) {
                showLoggedInUI(data.display_name || data.username);
            } else showLoggedOutUI();
        } catch (e) { console.warn('获取登录状态失败', e); showLoggedOutUI(); }
    }

    function showLoggedInUI(displayName) {
        showLoginBtn.style.display = 'none';
        userInfoBox.style.display = 'block';
        displayUserNameSpan.textContent = displayName;
    }

    function showLoggedOutUI() {
        showLoginBtn.style.display = 'inline-block';
        userInfoBox.style.display = 'none';
    }

    async function doLogin(e) {
        e.preventDefault();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const captcha = document.getElementById('loginCaptcha').value.trim();
        const errorMsgDiv = document.getElementById('loginErrorMsg');
        if (!username || !password || !captcha) {
            errorMsgDiv.textContent = '请填写账号、密码和验证码';
            errorMsgDiv.style.display = 'block';
            return;
        }
        errorMsgDiv.style.display = 'none';
        try {
            const resp = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, captcha }),
                credentials: 'include'
            });
            const data = await resp.json();
            if (data.success) {
                document.getElementById('hiddenUsername').value = username;
                document.getElementById('hiddenPassword').value = password;
                document.getElementById('hiddenCaptcha').value = captcha;
                document.getElementById('hiddenClientUA').value = navigator.userAgent;
                let nextInput = document.querySelector('input[name="next"]');
                if (nextInput) nextInput.value = '/solution-config';
                else {
                    nextInput = document.createElement('input');
                    nextInput.type = 'hidden';
                    nextInput.name = 'next';
                    nextInput.value = '/solution-config';
                    document.getElementById('savePasswordForm').appendChild(nextInput);
                }
                document.getElementById('savePasswordForm').submit();
            } else {
                errorMsgDiv.textContent = '登录失败: ' + data.message;
                errorMsgDiv.style.display = 'block';
                refreshCaptcha();
            }
        } catch (e) {
            errorMsgDiv.textContent = '请求异常，请稍后重试';
            errorMsgDiv.style.display = 'block';
            refreshCaptcha();
        }
    }

    async function doLogout() {
        await fetch('/api/logout', { method: 'POST', credentials: 'include' });
        showLoggedOutUI();
        await refreshCaptcha();
    }

    function togglePasswordVisibility() {
        const pwd = document.getElementById('loginPassword');
        if (pwd.type === 'password') { pwd.type = 'text'; togglePwdBtn.textContent = '🙈'; }
        else { pwd.type = 'password'; togglePwdBtn.textContent = '👁️'; }
    }

    async function showLoginModal() {
        await refreshCaptcha();
        document.getElementById('loginForm').reset();
        document.getElementById('loginErrorMsg').style.display = 'none';
        if (!loginModalInstance) loginModalInstance = new bootstrap.Modal(document.getElementById('loginModal'));
        loginModalInstance.show();
    }

    document.addEventListener('DOMContentLoaded', async () => {
        showLoginBtn.addEventListener('click', showLoginModal);
        logoutBtn.addEventListener('click', doLogout);
        captchaImg.addEventListener('click', refreshCaptcha);
        togglePwdBtn.addEventListener('click', togglePasswordVisibility);
        document.getElementById('loginForm').addEventListener('submit', doLogin);
        await checkLoginStatus();
    });

    // ---------- 配置变量 ----------
    let standardsData = [];

    async function solLoadLocalStandardsData() {
        try {
            const cfg = await fetch('/api/config').then(r => r.json());
            const excelPath = cfg.excelPath || '';
            if (!excelPath) return;
            const filename = excelPath.split('\\').pop();
            const resp = await fetch(`/organic_excel/${encodeURIComponent(filename)}`);
            if (!resp.ok) return;
            const buf = await resp.arrayBuffer();
            const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
            const ws = wb.Sheets['有机标准物质'];
            if (!ws) return;
            const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            if (rows.length < 2) return;
            let headerRow = null, headerIndex = -1;
            for (let i = 0; i < Math.min(5, rows.length); i++) {
                const first = rows[i]?.[0]?.toString().trim() || '';
                if (first.includes('编号') || first.includes('组别')) { headerRow = rows[i]; headerIndex = i; break; }
            }
            if (!headerRow) return;
            const colMap = { id: ['编号','序号'], group: ['组别'], labNo: ['实验室编号'], name: ['标品名称','名称'], cas: ['CAS号','CAS'] };
            const idx = {};
            for (let j = 0; j < headerRow.length; j++) {
                const cell = headerRow[j]?.toString().trim() || '';
                for (const [field, kws] of Object.entries(colMap)) {
                    if (idx[field] !== undefined) continue;
                    for (const kw of kws) { if (cell.includes(kw)) { idx[field] = j; break; } }
                }
            }
            const result = [];
            for (let r = headerIndex + 1; r < rows.length; r++) {
                const row = rows[r];
                const name = String(row[idx.name] ?? '').trim();
                if (!name) continue;
                result.push({
                    originalId: String(row[idx.id] ?? '').trim(),
                    group: String(row[idx.group] ?? '').trim(),
                    labNo: String(row[idx.labNo] ?? '').trim(),
                    name,
                    cas: String(row[idx.cas] ?? '').trim(),
                });
            }
            standardsData = result;
        } catch(e) { /* 加载失败不影响主功能 */ }
    }

    function solFindLocalStock(item) {
        if (!standardsData.length) return '—';
        const labNo = (item.customNum || item.no || '').trim();
        const casNo = (item.casNo || item.cas || '').trim();
        const name  = (item.name || '').trim();
        let found = null;
        if (labNo && labNo !== '/') found = standardsData.find(s => (s.labNo||'').trim() === labNo);
        if (!found && casNo) found = standardsData.find(s => (s.cas||'').trim() === casNo);
        if (!found && name)  found = standardsData.find(s => (s.name||'').trim() === name);
        if (!found) return '—';
        const g  = found.group      || '-';
        const id = (found.originalId && found.originalId !== '') ? found.originalId : '-';
        return `${g}/${id}`;
    }

        let certUncPath = '';
    let certBaseUrl = '/certificates/';

        function extractYear(labNo) { const match = labNo.match(/(\d{4})/); return match ? match[1] : null; }
    async function findAvailablePdfUrl(baseUrl, labNo) {
        if (!baseUrl.endsWith('/')) baseUrl += '/';
        const year = extractYear(labNo);
        const candidates = [baseUrl + encodeURIComponent(labNo) + '.pdf'];
        if (year) {
            candidates.push(baseUrl + year + '年标品证书/' + encodeURIComponent(labNo) + '.pdf');
            candidates.push(baseUrl + year + '标品证书/' + encodeURIComponent(labNo) + '.pdf');
            candidates.push(baseUrl + year + '年标品证书/消费品/' + encodeURIComponent(labNo) + '.pdf');
            candidates.push(baseUrl + year + '标品证书/消费品/' + encodeURIComponent(labNo) + '.pdf');
            candidates.push(baseUrl + year + '年标品证书/轻工/' + encodeURIComponent(labNo) + '.pdf');
            candidates.push(baseUrl + year + '标品证书/轻工/' + encodeURIComponent(labNo) + '.pdf');
        }
        for (const url of [...new Set(candidates)]) {
            try { const resp = await fetch(url, { method: 'HEAD', cache: 'no-store' }); if (resp.ok) return url; } catch(e) {}
        }
        return null;
    }

    function escapeAttr(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    // 领用量校验（单行模式遗留，多行模式下不调用）
    function solCheckQty() {
        const input = document.getElementById('solUseQty');
        const hint = document.getElementById('solUseQtyHint');
        const saveBtn = document.getElementById('solSaveBtn');
        if (!input || !hint) return true;
        input.classList.remove('is-invalid');
        hint.style.display = 'none';
        hint.className = 'small mt-1';
        if (!solCurrentItem) return true;
        const qty = parseFloat(input.value);
        const dec = (input.value.split('.')[1] || '');
        const unit = solCurrentItem.numUnitName || 'g';
        if (unit !== 'mL' && dec.length > 4) {
            input.classList.add('is-invalid');
            hint.textContent = '领用数量最多保留 4 位小数';
            hint.classList.add('text-danger');
            hint.style.display = 'block';
            if (saveBtn) saveBtn.disabled = true;
            return false;
        }
        const stock = parseFloat(solCurrentItem.validNum);
        if (isNaN(qty) || qty <= 0) return true;
        if (!isNaN(stock)) {
            if (qty > stock) {
                input.classList.add('is-invalid');
                hint.textContent = `超过剩余量 ${stock}${unit}`;
                hint.classList.add('text-danger');
                hint.style.display = 'block';
                if (saveBtn) saveBtn.disabled = true;
                return false;
            }
        }
        if (saveBtn) saveBtn.disabled = false;
        return true;
    }

    // 必填校验：导出 / 确认领用并保存 前调用
    function solValidateRequired() {
        if (!solItems.length) return false;
        let ok = true;
        // 验证配置日期、温度、湿度（始终必填）
        ['solConfigureDate','solTemp','solHumid'].forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            if (!(el.value||'').trim()) { el.classList.add('is-invalid'); ok = false; }
            else el.classList.remove('is-invalid');
        });
        // 配置设备：仅当存在 'g' 单位时才必填
        const deviceEl = document.getElementById('solDevice');
        const deviceVal = (deviceEl.value || '').trim();
        const hasGUnit = solItems.some(item => (item.numUnitName || 'g') === 'g');
        if (hasGUnit && !deviceVal) {
            deviceEl.classList.add('is-invalid');
            let errorSpan = document.getElementById('solDeviceError');
            if (!errorSpan) {
                errorSpan = document.createElement('div');
                errorSpan.id = 'solDeviceError';
                errorSpan.className = 'invalid-feedback';
                deviceEl.parentNode.appendChild(errorSpan);
            }
            errorSpan.style.display = 'block';
            ok = false;
        } else {
            deviceEl.classList.remove('is-invalid');
            const errorSpan = document.getElementById('solDeviceError');
            if (errorSpan) errorSpan.style.display = 'none';
        }
        const tbody = document.getElementById('solItemsTbody');
        solItems.forEach((item, idx) => {
            const valEl = tbody.querySelector(`.sol-row-validity[data-idx="${idx}"]`);
            const qtyEl = tbody.querySelector(`.sol-row-qty[data-idx="${idx}"]`);
            const volEl = tbody.querySelector(`.sol-row-volume[data-idx="${idx}"]`);
            const codeEl = tbody.querySelector(`.sol-row-code[data-idx="${idx}"]`);
            const stoEl = tbody.querySelector(`.sol-row-storage[data-idx="${idx}"]`);
            const medEl = tbody.querySelector(`.sol-row-medium[data-idx="${idx}"]`);
            [valEl, qtyEl, volEl, codeEl, stoEl, medEl].forEach(el => {
                if (!el) return;
                const v = (el.value||'').trim();
                const empty = !v || (el.type === 'number' && (isNaN(parseFloat(v)) || parseFloat(v) <= 0));
                if (empty) { el.classList.add('is-invalid'); ok = false; }
                else el.classList.remove('is-invalid');
            });
            if (qtyEl && item.validNum != null) {
                const qty = parseFloat(qtyEl.value);
                if (!isNaN(qty) && qty > parseFloat(item.validNum)) {
                    qtyEl.classList.add('is-invalid'); ok = false;
                }
            }
        });
        return ok;
    }

        const kwName  = document.getElementById('solSearchName').value.trim();

        const kwLabNo = document.getElementById('solSearchLabNo').value.trim();
        const kwOrg   = document.getElementById('solSearchOrg').value.trim();
        const kw = kwName || kwCas || kwLabNo || kwOrg;
        if (!kw) return;
        // LIMS keyword 不支持 CK-XX-数字 格式，提取末尾数字作为搜索词
        const kwMatch = kw.match(/^CK-[A-Z]+-(\d+)$/i);
        const searchKw = kwMatch ? kwMatch[1] : kw;
        const btn = document.getElementById('solSearchBtn');
        const resultsBox = document.getElementById('solSearchResults');

        document.getElementById('solResultCheckAll').checked = false;
        document.getElementById('solResultCheckAll').indeterminate = false;
        document.getElementById('solResultSelectedCount').textContent = '0';
        document.getElementById('solResultAddBtn').disabled = true;
        try {
            const kwStatus = document.getElementById('solSearchStatus').value;
            const resp = await fetch(`/api/query?keyword=${encodeURIComponent(searchKw)}&org_name=${encodeURIComponent(kwOrg)}&status=${encodeURIComponent(kwStatus)}`);

            if (!data.success) {
                tbody.innerHTML = `<tr><td colspan="10" class="text-center text-danger small py-3">${escapeHtml(data.message)}</td></tr>`;
                return;
            }
            const list = data.data || [];
            if (!list.length) {
                tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted small py-3">未找到匹配标准品</td></tr>';
                return;
            }
            solLastResults = list;
            // 前端联合过滤（各框非空时必须匹配）
            const filterName  = document.getElementById('solSearchName').value.trim().toLowerCase();
            const filterCas   = document.getElementById('solSearchCas').value.trim().toLowerCase();
            const filterLabNo = document.getElementById('solSearchLabNo').value.trim().toLowerCase();
            const filterOrg   = document.getElementById('solSearchOrg').value.trim().toLowerCase();
            const filtered = list.filter(item => {
                if (filterName  && !(item.name||'').toLowerCase().includes(filterName))   return false;
                if (filterCas   && !(item.casNo||item.cas||'').toLowerCase().includes(filterCas)) return false;
                if (filterLabNo && !(item.customNum||item.no||'').toLowerCase().includes(filterLabNo)) return false;
                if (filterOrg   && !(item.orgName||'').toLowerCase().includes(filterOrg)) return false;
                return true;
            });
            if (!filtered.length) {
                tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted small py-3">无匹配结果</td></tr>';
                return;
            }
            tbody.innerHTML = filtered.map((item, i) => {
                const spec  = item.standard || (item.totalNum ? `${item.totalNum}${item.numUnitName||''}` : '');
                const stock = (item.validNum != null && item.validNum !== '')
                    ? `${item.validNum}${item.numUnitName||''}` : '—';
                const stockDisplay = spec ? `${spec}/${stock}` : stock;
                const conc = item.concentration ? `${item.concentration}(${item.concentrationUnitName||''})` : '—';
                const labNo = item.customNum || item.no || '—';
                const pdfIcon = (labNo && labNo !== '/' && labNo !== '—')
                    ? `<i class="fas fa-file-pdf cert-icon ms-1" data-labno="${escapeAttr(labNo)}" title="打开证书"></i>` : '';
                const realIdx = list.indexOf(item);
                return `<tr data-idx="${realIdx}">
                    <td><input type="checkbox" class="sol-result-check" data-idx="${realIdx}"></td>
                    <td><div class="d-flex justify-content-between align-items-center">${escapeHtml(labNo)}${pdfIcon}</div></td>
                    <td class="text-start"><strong>${escapeHtml(item.name||'')}</strong></td>

    function solCalcRowConc(idx) {
        const item = solItems[idx];
        if (!item) return;
        const tbody = document.getElementById('solItemsTbody');
        const qtyEl = tbody.querySelector(`.sol-row-qty[data-idx="${idx}"]`);
        const volEl = tbody.querySelector(`.sol-row-volume[data-idx="${idx}"]`);
        const concEl = tbody.querySelector(`.sol-row-conc[data-idx="${idx}"]`);
        const codeEl = tbody.querySelector(`.sol-row-code[data-idx="${idx}"]`);
        const nameEl = tbody.querySelector(`.sol-row-name[data-idx="${idx}"]`);
        const validEl = tbody.querySelector(`.sol-row-validity[data-idx="${idx}"]`);
        if (!qtyEl || !volEl || !concEl || !codeEl) return;
        const unit = item.numUnitName || 'g';
        const concUnit = item.concentrationUnitName || (unit === 'g' ? '%' : 'μg/mL');
        const purityRaw = parseFloat((item.concentration || '99.5').replace('%','').trim());
        const qty = parseFloat(qtyEl.value);
        const vol = parseFloat(volEl.value);
        const qtyStr = qtyEl.value;
        const qtyDec = (qtyStr.split('.')[1] || '');
        const maxDec = unit === 'mL' ? 2 : 4;
        // 小数位超限立即标红
        if (qtyDec.length > maxDec) {
            qtyEl.classList.add('is-invalid');
            concEl.value = ''; codeEl.value = ''; return;
        }
        // 领用量超库存标红
        if (item.validNum != null) {
            if (!isNaN(qty) && qty > parseFloat(item.validNum)) qtyEl.classList.add('is-invalid');
            else qtyEl.classList.remove('is-invalid');
        } else {
            qtyEl.classList.remove('is-invalid');
        }
        if (isNaN(qty) || isNaN(vol) || qty <= 0 || vol <= 0 || isNaN(purityRaw)) { concEl.value = ''; codeEl.value = ''; return; }
        // 定容体积修约: >=10mL 4位有效数字, <10mL 3位有效数字
        const volN = vol >= 10 ? 4 : 3;
        const volMag = Math.floor(Math.log10(Math.abs(vol)));
        const volDec = Math.max(0, volN - 1 - volMag);
        const volF = Math.pow(10, volDec);
        const volRounded = Math.round(vol * volF) / volF;
        // 浓度计算
        let conc = concUnit === '%' ? purityRaw / 100.0 * qty * 1000000 / volRounded : purityRaw * qty / volRounded;
        let concStr;
        if (concUnit === '%') {
            concStr = String(Number(conc.toPrecision(12)));
        } else {
            const decimals = conc < 0.10 ? 3 : 2;
            concStr = conc.toFixed(decimals);
        }
        const concRounded = parseFloat(concStr);
        concEl.value = concStr;

        const baseNum = item.customNum || item.no || 'CK-CG-UNKNOWN';
        const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
        codeEl.value = concEl.value ? `${baseNum}-${concStr}-${today}` : '';
        codeEl.title = codeEl.value;

        const solName = (nameEl ? nameEl.value : '').toUpperCase();
        const casNo = (item.casNo || '').trim();
        const solType = document.getElementById('solType').value;
        const SHORT_LIFE_CAS = ['584-84-9', '822-06-0', '91-08-7', '101-68-8'];
        let days;
        if (SHORT_LIFE_CAS.includes(casNo)) days = 14;
        else if (solName.includes('偶氮') || solName.includes('AZO')) days = 30;
        else if (solType === 'SOLUTION_TYPE_D') days = 30;
        else if (concRounded > 1000) days = 365;
        else if (concRounded >= 500) days = 180;
        else days = 90;
        const expiry = new Date();
        expiry.setDate(expiry.getDate() + days);
        if (item.validDate) {
            const stdExpiry = new Date(item.validDate);
            if (expiry > stdExpiry) expiry.setTime(stdExpiry.getTime());
        }
        if (validEl) validEl.value = expiry.toISOString().slice(0,10);
    }

    async function updateExcelUsage(labNo, newUsage) {
        if (!labNo || labNo === '/' || labNo === '') return;
        try {

            const data = await resp.json();
            if (!data.success) {
                console.warn(`更新使用情况失败 (${labNo}): ${data.message}`);
            } else {
                console.log(`更新使用情况成功 (${labNo}) -> ${newUsage}`);
            }
        } catch (err) {
            console.warn(`调用更新接口异常 (${labNo}):`, err);
        }
    }

    async function solSave() {
        if (!solItems.length) { alert('请先添加标准品'); return; }
        if (!solValidateRequired()) return;
        const btn = document.getElementById('solSaveBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>保存中...';
        let savedCount = 0;
        const tbody = document.getElementById('solItemsTbody');
        try {
            for (let idx = 0; idx < solItems.length; idx++) {
                const item = solItems[idx];
                const qty = parseFloat((tbody.querySelector(`.sol-row-qty[data-idx="${idx}"]`)||{}).value);
                const vol = parseFloat((tbody.querySelector(`.sol-row-volume[data-idx="${idx}"]`)||{}).value);
                const concVal = (tbody.querySelector(`.sol-row-conc[data-idx="${idx}"]`)||{}).value || '';
                const medium = (tbody.querySelector(`.sol-row-medium[data-idx="${idx}"]`)||{}).value || '';
                if (!qty || qty <= 0 || !vol || vol <= 0 || !concVal) { continue; }

                // 1. 领用
                const recResp = await fetch('/api/lims/receive', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({consumable_id: String(item.id), quantity: qty})
                });
                const recData = await recResp.json();
                if (!recData.success) { alert(`第${idx+1}条领用失败: ${recData.message}`); continue; }

                // 2. 保存配置
                const payload = solBuildRowPayload(item, idx, recData.receive_id, qty, vol, concVal, medium);
                const saveResp = await fetch('/api/lims/save_solution', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const saveData = await saveResp.json();
                if (!saveData.success) { alert(`第${idx+1}条保存失败: ${saveData.message}`); continue; }

                // 3. 更新 Excel 使用情况
                const labNo = item.customNum ? item.customNum.trim() : '';
                if (labNo && labNo !== '/' && labNo !== '') {
                    await updateExcelUsage(labNo, '开封');
                }

                savedCount++;
            }
        } catch(e) {
            alert('操作异常: ' + e.message);
        } finally {
            btn.disabled = false;
            if (savedCount === solItems.length && solItems.length > 0) solSetBtnSaved(true);
            else solSetBtnSaved(false);
        }
    }

    async function solExport() {
        if (!solItems.length) { alert('请先添加标准品'); return; }
        if (!solValidateRequired()) return;
        const tbody = document.getElementById('solItemsTbody');
        const btn = document.getElementById('solExportBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>生成中...';
        let exported = false;
        try {
            for (let idx = 0; idx < solItems.length; idx++) {
                const item = solItems[idx];
                const qty = parseFloat((tbody.querySelector(`.sol-row-qty[data-idx="${idx}"]`)||{}).value);
                const vol = parseFloat((tbody.querySelector(`.sol-row-volume[data-idx="${idx}"]`)||{}).value);
                const concVal = (tbody.querySelector(`.sol-row-conc[data-idx="${idx}"]`)||{}).value || '';
                const medium = (tbody.querySelector(`.sol-row-medium[data-idx="${idx}"]`)||{}).value || '';
                if (!concVal) { alert(`第${idx+1}条请先填写领用数量和定容体积以计算浓度`); continue; }
                const payload = solBuildRowPayload(item, idx, '', qty, vol, concVal, medium);
                const resp = await fetch('/api/lims/export_docx', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({message: resp.statusText}));
                    alert(`第${idx+1}条导出失败: ` + err.message); continue;
                }
                const blob = await resp.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const cd = resp.headers.get('Content-Disposition') || '';
                const m = cd.match(/filename\*?=(?:UTF-8'')?["']?([^"';\r\n]+)/i);
                a.download = m ? decodeURIComponent(m[1]) : `配制记录_${idx+1}.docx`;
                a.href = url;
                a.click();
                URL.revokeObjectURL(url);
                exported = true;
            }
        } catch(e) {
            alert('导出异常: ' + e.message);
        } finally {
            btn.disabled = false;
            if (exported) solSetBtnExported(true);
            else solSetBtnExported(false);
        }
    }


    function solBuildRowPayload(item, idx, receiveId, qty, vol, concVal, medium) {
        const unit = item.numUnitName || 'g';
        const concUnit = item.concentrationUnitName || (unit === 'g' ? '%' : 'μg/mL');
        const baseNum = item.customNum || item.no || 'CK-CG-UNKNOWN';
        const tbody = document.getElementById('solItemsTbody');
        const codeEl = tbody.querySelector(`.sol-row-code[data-idx="${idx}"]`);
        const nameEl = tbody.querySelector(`.sol-row-name[data-idx="${idx}"]`);
        const validEl = tbody.querySelector(`.sol-row-validity[data-idx="${idx}"]`);
        const storEl = tbody.querySelector(`.sol-row-storage[data-idx="${idx}"]`);
        const rowCode = codeEl ? codeEl.value.trim() : `${baseNum}-${concVal}-${new Date().toISOString().slice(0,10).replace(/-/g,'')}`;
        const rowName = nameEl ? nameEl.value.trim() : (item.name || '');
        const rowValidity = validEl ? validEl.value : '';
        const rowStorage = storEl ? storEl.value : '-4℃冰箱';
        return {
            receive_id: receiveId,
            original_id: String(item.id),
            original_name: item.name || '',
            original_code: receiveId ? `L-${receiveId}` : '',
            purity_str: String(item.concentration || '99.5'),
            original_unit: concUnit,
            received_unit: unit,
            batch_no: item.batchNo || '',
            expiry_date: item.validDate || '',
            base_custom_num: baseNum,
            solution_name: rowName || item.name || '',
            solution_code: rowCode,
            configure_date: document.getElementById('solConfigureDate').value,
            validity_date: rowValidity,
            medium: medium,
            volume_ml: vol,
            use_quantity: qty,
            solution_type: document.getElementById('solType').value,
            page_type: 'SOLUTION_TYPE_A',
            storage_location: item.storagePositionName || '4-1-华业4-1',
            storage_condition: rowStorage,
            temperature: document.getElementById('solTemp').value.trim() || null,
            humidity: document.getElementById('solHumid').value.trim() || null,
            device_names: document.getElementById('solDevice').value.trim() || null,
            original_no: `A-${item.id}\n${item.batchNo||''}\n${rowCode}`,
            config_conc: parseFloat(concVal) || 0
        };
    }


        // ===== B-BCD: 从已配储备液 B 配制混合液 =====
    let bbcdLastResults = [];

    function bbcdParseConc(str) {
        const m = /^([\d.]+)\s*\(([^)]+)\)$/.exec((str || '').trim());
        return m ? { value: parseFloat(m[1]), unit: m[2] } : { value: NaN, unit: '' };
    }

    function bbcdEsc(s) { return escapeHtml(s == null ? '' : String(s)); }

    // 修约规则（与 A-B μg/mL 时一致）
    function bbcdRoundQty(v) { return Math.round(v * 100) / 100; }
    function bbcdFmtQty(v) { return v.toFixed(2); }
    function bbcdRoundVol(v) {
        if (!isFinite(v) || v <= 0) return v;
        const n = v >= 10 ? 4 : 3;
        const mag = Math.floor(Math.log10(Math.abs(v)));
        const decimals = Math.max(0, n - 1 - mag);
        const f = Math.pow(10, decimals);
        return Math.round(v * f) / f;
    }
    function bbcdFmtVol(v) {
        if (!isFinite(v) || v <= 0) return '';
        const n = v >= 10 ? 4 : 3;
        const mag = Math.floor(Math.log10(Math.abs(v)));
        const decimals = Math.max(0, n - 1 - mag);
        return v.toFixed(decimals);
    }
    function bbcdRoundConc(v) { return v < 0.10 ? Math.round(v * 1000) / 1000 : Math.round(v * 100) / 100; }
    function bbcdFmtConc(v) { return v < 0.10 ? v.toFixed(3) : v.toFixed(2); }

    // 自编号自动生成
    let bbcdCodeAuto = true;

    // 从多个 solutionCode 中提取出现最多的"CK-XX"前缀（取最后一个 - 之前的部分）
    function bbcdDominantPrefix(codes) {
        const counts = new Map();
        codes.forEach(c => {
            // 取倒数第二段以前，例如 CK-CG-2026033 → CK-CG
            const parts = c.split('-');
            const pref = parts.length >= 3 ? parts.slice(0, -1).join('-') : c;
            counts.set(pref, (counts.get(pref) || 0) + 1);
        });
        let prefix = '', max = 0;
        counts.forEach((n, k) => { if (n > max) { max = n; prefix = k; } });
        // 只保留 CK-XX 两段，例如 CK-CG-2026 → CK-CG
        const p = prefix.split('-');
        return p.length >= 2 ? p.slice(0, 2).join('-') : prefix;
    }

    function bbcdComputeSingleConc() {
        // 单行：用实际计算浓度（bbcdRecalcRow 已写入 cell）
        const rows = [...document.querySelectorAll('#bbcdConfigTable tbody tr')];
        if (rows.length !== 1) return '';
        const tr = rows[0];
        const qty = parseFloat(tr.querySelector('.bbcd-c-qty').value);
        const vol = parseFloat(document.getElementById('bbcdVolume')?.value);
        if (!qty || !vol || qty <= 0 || vol <= 0 || isNaN(tr._src.concValue)) return '';
        const c = bbcdRoundConc(tr._src.concValue * qty / vol);
        return bbcdFmtConc(c);
    }

    function bbcdComputeAvgConcStr() {
        const rows = [...document.querySelectorAll('#bbcdConfigTable tbody tr')];
        const vol = parseFloat(document.getElementById('bbcdVolume')?.value);
        if (!vol || vol <= 0) return '';
        const vals = [];
        rows.forEach(tr => {
            const qty = parseFloat(tr.querySelector('.bbcd-c-qty').value);
            if (!qty || qty <= 0 || isNaN(tr._src.concValue)) return;
            vals.push(tr._src.concValue * qty / vol);
        });
        if (!vals.length) return '';
        const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
        return bbcdFmtConc(bbcdRoundConc(mean));
    }

    function bbcdUpdateCode() {
        if (!bbcdCodeAuto) return;
        const codeEl = document.getElementById('bbcdSolutionCode');
        if (!codeEl) return;

        // 工作液模式下使用浓度范围格式
        const solType = document.getElementById('bbcdSolType').value;
        if (solType === 'SOLUTION_TYPE_D') {
            bbcdUpdateCodeForWorkingSolution();
            return;
        }

        const rows = [...document.querySelectorAll('#bbcdConfigTable tbody tr')];
        const srcList = rows.map(tr => tr._src).filter(Boolean);
        const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
        if (srcList.length === 0) { codeEl.value = ''; codeEl.classList.remove('bbcd-code-confirm'); return; }
        if (srcList.length === 1) {
            const concStr = bbcdComputeSingleConc();
            if (!concStr) { codeEl.value = ''; codeEl.classList.remove('bbcd-code-confirm'); return; }
            const sc = (srcList[0].solutionCode || '').replace(/-[\d.]+?-\d{8}$/, '');
            codeEl.value = `${sc}-${concStr}-${today}`;
            codeEl.classList.remove('bbcd-code-confirm');
        } else {
            const concStr = bbcdComputeAvgConcStr();
            if (!concStr) { codeEl.value = ''; codeEl.classList.remove('bbcd-code-confirm'); return; }
            const codes = srcList.map(s => s.solutionCode).filter(Boolean);
            const prefix = codes.length ? bbcdDominantPrefix(codes) : 'CK-CG';
            codeEl.value = `${prefix}-${srcList.length}XX-${concStr}-${today}`;
            codeEl.classList.add('bbcd-code-confirm');
        }
    }

    // 工作液自编号：支持浓度范围
    function bbcdUpdateCodeForWorkingSolution() {
        const codeEl = document.getElementById('bbcdSolutionCode');
        if (!codeEl) return;

        const rows = [...document.querySelectorAll('#bbcdConfigTable tbody tr')].filter(tr => tr._src);
        const srcList = rows.map(tr => tr._src).filter(Boolean);
        const today = new Date().toISOString().slice(0,10).replace(/-/g,'');

        if (srcList.length === 0) {
            codeEl.value = '';
            codeEl.classList.remove('bbcd-code-confirm');
            return;
        }

        const count = window.bbcdCurrentDilutionCount || 5;

        if (srcList.length === 1) {
            // 单源：收集所有计算浓度
            const allConcs = [];
            rows.forEach(tr => {
                tr.querySelectorAll('.bbcd-d-conc').forEach(span => {
                    const text = span.textContent.trim();
                    if (text && text !== '—') {
                        const v = parseFloat(text);
                        if (isFinite(v) && v > 0) allConcs.push(v);
                    }
                });
            });

            if (allConcs.length === 0) {
                codeEl.value = '';
                codeEl.classList.remove('bbcd-code-confirm');
                return;
            }

            const minConc = Math.min(...allConcs);
            const maxConc = Math.max(...allConcs);
            const concRange = `${bbcdFmtConc(minConc)}-${bbcdFmtConc(maxConc)}`;

            const sc = (srcList[0].solutionCode || '').replace(/-[\d.\[\]]+?-\d{8}$/, '');
            codeEl.value = `${sc}-[${concRange}]-${today}`;
            codeEl.classList.remove('bbcd-code-confirm');
        } else {
            // 多源：计算每个稀释点的平均浓度
            const avgConcs = [];
            for (let i = 0; i < count; i++) {
                const concsAtPoint = [];
                rows.forEach(tr => {
                    const concCell = tr.querySelector(`.bbcd-d-conc[data-dilution="${i}"]`);
                    const text = concCell?.textContent.trim();
                    if (text && text !== '—') {
                        const v = parseFloat(text);
                        if (isFinite(v) && v > 0) concsAtPoint.push(v);
                    }
                });
                if (concsAtPoint.length > 0) {
                    const avg = concsAtPoint.reduce((sum, c) => sum + c, 0) / concsAtPoint.length;
                    avgConcs.push(avg);
                }
            }

            if (avgConcs.length === 0) {
                codeEl.value = '';
                codeEl.classList.remove('bbcd-code-confirm');
                return;
            }

            const minAvg = Math.min(...avgConcs);
            const maxAvg = Math.max(...avgConcs);
            const concRange = `${bbcdFmtConc(minAvg)}-${bbcdFmtConc(maxAvg)}`;

            const codes = srcList.map(s => s.solutionCode).filter(Boolean);
            const prefix = codes.length ? bbcdDominantPrefix(codes) : 'CK-CG';
            codeEl.value = `${prefix}-${srcList.length}XX-[${concRange}]-${today}`;
            codeEl.classList.add('bbcd-code-confirm');
        }
    }

    async function bbcdQuery() {

            name: document.getElementById('bbcdFilterName').value.trim(),
            code: document.getElementById('bbcdFilterCode').value.trim(),
            custom_type: document.getElementById('bbcdFilterCustomType').value.trim(),

        });

            const resp = await fetch('/api/lims/list_configured_solutions?' + params.toString());

            bbcdLastResults = [];

    function bbcdRenderResults(list) {
        // 按 BC类型 筛选
        const typeFilter = document.getElementById('bbcdFilterSolType').value;
        if (typeFilter) {
            const detectType = item => {
                const order = String(item.configureOrder || '').toUpperCase();
                if (order.startsWith('B-')) return 'SOLUTION_TYPE_B';
                if (order.startsWith('C-')) return 'SOLUTION_TYPE_C';
                return item.type || item.solutionType || '';
            };
            list = list.filter(item => detectType(item) === typeFilter);
        }
        const tbody = document.querySelector('#bbcdResultTable tbody');
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted small py-3">无匹配记录</td></tr>';
        } else {
            tbody.innerHTML = list.map((item, idx) => {
                const realIdx = bbcdLastResults.indexOf(item);
                return `
                <tr>
                    <td><input type="checkbox" class="bbcd-row-check" data-idx="${realIdx}"></td>
                    <td>${bbcdEsc(item.configureOrder)}</td>
                    <td class="text-truncate" style="max-width:180px;" title="${bbcdEsc(item.solutionCode)}">${bbcdEsc(item.solutionCode)}</td>
                    <td class="text-truncate" style="max-width:200px;" title="${bbcdEsc(item.solutionName)}">${bbcdEsc(item.solutionName)}</td>
                    <td class="text-truncate" style="max-width:240px;" title="${bbcdEsc(item.concentrationCount || item.concentration)}">${bbcdEsc(item.concentration)}</td>
                    <td>${item.constantVolume != null ? Number(item.constantVolume).toFixed(2) : '—'}</td>
                    <td>${bbcdEsc(item.configuratorName || item.creatorName || '—')}</td>
                    <td>${bbcdEsc(item.configureDate || '—')}</td>
                    <td>${bbcdEsc(item.validityDate || '—')}</td>
                    <td>${item.auditUserName ? '<span class="badge bg-success">已审核</span>' : '<span class="badge bg-secondary">未审核</span>'}</td>
                </tr>`;
            }).join('');
        }
        bbcdRefreshFilterOptions(list);
        bbcdUpdateSelection();
        // 单条结果自动选中
        if (list.length === 1) {
            const cb = tbody.querySelector('.bbcd-row-check');
            if (cb) { cb.checked = true; bbcdUpdateSelection(); }
        }
    }

    function bbcdRefreshFilterOptions(list) {
        const fillList = (id, values) => {
            const dl = document.getElementById(id);
            dl.innerHTML = values.map(v => `<option value="${bbcdEsc(v)}"></option>`).join('');
        };
        const customTypes = [...new Set(list.map(it => it.customType).filter(Boolean))].sort();
        const operators = [...new Set(list.map(it => it.configuratorName || it.creatorName).filter(Boolean))].sort();
        fillList('bbcdFilterCustomTypeList', customTypes);
        fillList('bbcdFilterOperatorList', operators);
    }

    function bbcdUpdateSelection() {
        const checks = document.querySelectorAll('.bbcd-row-check');
        const checked = [...checks].filter(c => c.checked);
        document.getElementById('bbcdSelectedCount').textContent = checked.length;
        document.getElementById('bbcdConfigBtn').disabled = checked.length === 0;
        const all = document.getElementById('bbcdCheckAll');
        all.checked = checks.length > 0 && checked.length === checks.length;
        all.indeterminate = checked.length > 0 && checked.length < checks.length;
    }

    function bbcdResetFilters() {
        ['bbcdFilterName','bbcdFilterCode','bbcdFilterDateFrom','bbcdFilterDateTo','bbcdFilterCustomType','bbcdFilterOperator'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('bbcdFilterAuditStatus').value = '';
        document.getElementById('bbcdFilterSolType').value = '';
        document.getElementById('bbcdFilterConfigStatus').value = '0';
    }

    // 用于保存配置弹窗打开前的选中状态
    let bbcdSelectedIndices = [];
    // 全局标志：防止 Modal 转换期间重复触发
    let bbcdModalTransitioning = false;
    // 标志：用户已选择类型，等待类型选择弹窗关闭后打开配置弹窗
    let bbcdPendingTypeSelection = false;

    function bbcdOpenConfig() {
        const selectedIdx = [...document.querySelectorAll('.bbcd-row-check')]
            .filter(c => c.checked).map(c => parseInt(c.dataset.idx, 10));
        if (!selectedIdx.length) return;
        // 保存选中状态
        bbcdSelectedIndices = selectedIdx;
        const items = selectedIdx.map(i => bbcdLastResults[i]);

        // 保存选中的 items 到全局变量，供后续使用
        window.bbcdSelectedItems = items;

        bbcdCodeAuto = true;
        const customTypes = [...new Set(items.map(it => it.customType).filter(Boolean))];
        document.getElementById('bbcdCustomType').value = customTypes.length === 1 ? customTypes[0] : '';
        document.getElementById('bbcdSolutionName').value = '';
        document.getElementById('bbcdSolutionCode').value = '';
        document.getElementById('bbcdSolutionCode').classList.remove('bbcd-code-confirm');

        const today = new Date();
        document.getElementById('bbcdConfigureDate').value = today.toISOString().slice(0,10);

        // 检测溶液类型
        const solType = document.getElementById('bbcdSolType').value;
        const isWorkingSolution = (solType === 'SOLUTION_TYPE_D');

        // 工作液有效期默认30天，其他类型为空
        if (isWorkingSolution) {
            const validityDate = new Date(today);
            validityDate.setDate(validityDate.getDate() + 30);
            document.getElementById('bbcdValidityDate').value = validityDate.toISOString().slice(0,10);
        } else {
            document.getElementById('bbcdValidityDate').value = '';
        }

        document.getElementById('bbcdTemp').value = '';
        document.getElementById('bbcdHumid').value = '';
        document.getElementById('bbcdStorage').value = '';
        document.getElementById('bbcdValidityHint').style.display = 'none';
        document.getElementById('bbcdExportBtn').disabled = true;
        document.getElementById('bbcdExportBtn').className = 'btn btn-sm btn-outline-secondary';
        document.getElementById('bbcdExportBtn').innerHTML = '<i class="fas fa-file-word me-1"></i>导出配制记录';

        // 显示/隐藏稀释点区域
        const dilutionSection = document.getElementById('bbcdDilutionSection');
        if (dilutionSection) {
            dilutionSection.style.display = isWorkingSolution ? 'block' : 'none';
        }

        // 根据类型隐藏/显示标准字段（仅在元素存在时操作）
        const volumeCol = document.getElementById('bbcdVolume')?.closest('td');
        if (volumeCol) {
            volumeCol.style.display = isWorkingSolution ? 'none' : '';
        }

        const tbody = document.querySelector('#bbcdConfigTable tbody');
        tbody.innerHTML = '';

        if (isWorkingSolution) {
            // 工作液：等待用户生成稀释点后再渲染表格
            tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-3">请先输入稀释点数量并点击"生成稀释点"按钮</td></tr>';
        } else {
            // B/C 类型的现有渲染逻辑
            items.forEach((it, idx) => {
                const parsed = bbcdParseConc(it.concentration);
                const tr = document.createElement('tr');
                tr._src = {
                    id: it.id,
                    configureOrder: it.configureOrder || '',
                    solutionName: it.solutionName || '',
                    solutionCode: it.solutionCode || '',
                    originalCode: it.originalCode || '',
                    controlledNo: it.controlledNo || '',
                    concValue: parsed.value,
                    concUnit: parsed.unit,
                    concentrationRaw: it.concentration || '',
                    constantVolume: Number(it.constantVolume || 0),
                    validityDate: it.validityDate || '',
                };
                const sharedCells = idx === 0 ? `
                    <td rowspan="${items.length}">
                        <input id="bbcdMedium" class="form-control form-control-sm" list="solMediumOptions" placeholder="选择或输入" autocomplete="off">
                    </td>
                    <td rowspan="${items.length}">
                        <input type="number" id="bbcdVolume" class="form-control form-control-sm" step="0.01" min="0.01" value="10.00" style="-moz-appearance:textfield;">
                    </td>` : '';
                tr.innerHTML = `
                    <td><span class="bbcd-c-order">${bbcdEsc(tr._src.configureOrder)}</span></td>
                    <td class="text-start small"><span class="bbcd-c-srcName">${bbcdEsc(tr._src.solutionName)}</span></td>
                    <td><span class="bbcd-c-srcConc" title="剩余 ${tr._src.constantVolume.toFixed(2)} mL">${isNaN(tr._src.concValue) ? '—' : tr._src.concValue + ' ' + bbcdEsc(tr._src.concUnit)}</span></td>
                    <td><input type="number" class="form-control form-control-sm bbcd-c-qty" step="0.01" min="0.01" max="${tr._src.constantVolume}" style="-moz-appearance:textfield;"></td>
                    ${sharedCells}
                    <td><span class="bbcd-c-conc">—</span><span class="bbcd-c-unit ms-1 text-muted small">${bbcdEsc(tr._src.concUnit)}</span></td>`;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('bbcdFillBar').style.display = items.length > 1 && !isWorkingSolution ? 'block' : 'none';
        document.getElementById('bbcdFillQty').value = '';
        // 动态修改模态框标题
        const titleMap = { SOLUTION_TYPE_B: '储备液配置参数', SOLUTION_TYPE_C: '应用液配置参数', SOLUTION_TYPE_D: '工作液配置参数' };
        const solTypeEl = document.getElementById('bbcdSolType');
        const solTypeVal = solTypeEl ? solTypeEl.value : 'SOLUTION_TYPE_B';
        const bbcdModalTitle = document.querySelector('#bbcdConfigModal .modal-title');
        if (bbcdModalTitle) {
            // 只更新标题文本，不破坏 bbcdSolType 和 bbcdSolTypeLabel 元素
            const iconHtml = '<i class="fas fa-vial me-1"></i>';
            const titleText = titleMap[solTypeVal] || '混合液配置参数';
            // 查找或创建文本节点
            const firstChild = bbcdModalTitle.firstChild;
            if (firstChild && firstChild.nodeType === Node.TEXT_NODE) {
                firstChild.textContent = titleText;
            } else {
                bbcdModalTitle.insertBefore(document.createTextNode(titleText), firstChild);
            }
            // 确保图标存在
            const icon = bbcdModalTitle.querySelector('i.fas.fa-vial');
            if (!icon) {
                bbcdModalTitle.insertAdjacentHTML('afterbegin', iconHtml);
            }
        }
        bootstrap.Modal.getOrCreateInstance(document.getElementById('bbcdConfigModal')).show();
        if (document.getElementById('bbcdSolType').value !== 'SOLUTION_TYPE_D') {
            bbcdRecalcAll();
        }
        bbcdCheckValidity();
    }

    // 生成稀释点
    function bbcdGenerateDilutionPoints() {
        const count = parseInt(document.getElementById('bbcdDilutionCount').value);
        if (!count || count < 1 || count > 12) {
            alert('请输入有效的稀释点数量（1-12）');
            return;
        }

        // 保存稀释点数量到全局变量
        window.bbcdCurrentDilutionCount = count;

        // 重新渲染配置表格
        const items = window.bbcdSelectedItems || [];
        if (items.length > 0) {
            bbcdRenderWorkingSolutionTable(items);
        }
    }

    // 重置工作液配置
    function bbcdResetWorkingSolution() {
        // 清空所有定容体积输入
        document.querySelectorAll('.bbcd-dilution-vol').forEach(input => {
            input.value = '';
        });

        // 清空所有移取体积输入
        document.querySelectorAll('.bbcd-d-qty').forEach(input => {
            input.value = '';
        });

        // 清空所有计算浓度显示
        document.querySelectorAll('.bbcd-d-conc').forEach(span => {
            span.textContent = '—';
        });

        // 清空批填充输入框
        const batchVolAll = document.getElementById('bbcdBatchVolumeAll');
        if (batchVolAll) batchVolAll.value = '';
        document.querySelectorAll('.bbcd-batch-qty').forEach(input => {
            input.value = '';
        });

        // 重置逐级稀释开关为开启状态
        const gradualSwitch = document.getElementById('bbcdGradualDilution');
        if (gradualSwitch) gradualSwitch.checked = true;

        // 触发验证
        bbcdCheckValidity();
    }

    // 批量填充定容体积（横向：填充所有稀释点）
    function bbcdBatchFillVolumeAll() {
        const input = document.getElementById('bbcdBatchVolumeAll');
        const val = input?.value;
        if (!val) return;
        const v = parseFloat(val);
        if (!isFinite(v) || v <= 0) {
            alert('请输入有效的定容体积');
            return;
        }
        const formatted = bbcdFmtVol(bbcdRoundVol(v));
        // 填充所有稀释点的定容体积
        document.querySelectorAll('.bbcd-dilution-vol').forEach(volInput => {
            volInput.value = formatted;
        });
        bbcdRecalcWorkingSolution();
        bbcdCheckValidity();
    }

    // 批量填充移取体积（纵向：填充指定稀释点的所有源储备液）
    function bbcdBatchFillQty(dilutionIdx) {
        const input = document.querySelector(`.bbcd-batch-qty[data-idx="${dilutionIdx}"]`);
        const val = input?.value;
        if (!val) return;
        const v = parseFloat(val);
        if (!isFinite(v) || v <= 0) {
            alert('请输入有效的移取体积');
            return;
        }
        const formatted = bbcdFmtQty(bbcdRoundQty(v));
        // 填充该稀释点的所有源储备液的移取体积
        document.querySelectorAll(`.bbcd-d-qty[data-dilution="${dilutionIdx}"]`).forEach(qtyInput => {
            qtyInput.value = formatted;
        });
        bbcdRecalcWorkingSolution();
        bbcdCheckValidity();
    }

    // 渲染工作液配置表格

            <td colspan="2" class="fw-bold text-start">定容体积 (mL)</td>

                <div class="d-flex gap-1">
                    <input type="number" class="form-control form-control-sm" id="bbcdBatchVolumeAll" step="0.01" min="0.01" placeholder="批量" style="width:60px;-moz-appearance:textfield;">
                    <button type="button" class="btn btn-sm btn-outline-primary px-1" onclick="bbcdBatchFillVolumeAll()" title="批量填充所有定容体积">

                    </button>
                </div>
            </td>`;
        for (let i = 0; i < count; i++) {
            volumeHTML += `<td><input type="number" class="form-control form-control-sm bbcd-dilution-vol" data-idx="${i}" step="0.01" min="0.01" placeholder="定容" style="-moz-appearance:textfield;"></td>`;
        }
        for (let i = 0; i < count; i++) {
            volumeHTML += `<td>—</td>`;
        }
        volumeRow.innerHTML = volumeHTML;
        tbody.appendChild(volumeRow);

        // 后续行：源储备液数据

            const parsed = bbcdParseConc(it.concentration);

            tr._src = {
                id: it.id,
                configureOrder: it.configureOrder || '',
                solutionName: it.solutionName || '',
                solutionCode: it.solutionCode || '',
                originalCode: it.originalCode || '',
                controlledNo: it.controlledNo || '',
                concValue: parsed.value,
                concUnit: parsed.unit,
                concentrationRaw: it.concentration || '',

            // 添加移取体积输入框
            for (let i = 0; i < count; i++) {
                rowHTML += `<td><input type="number" class="form-control form-control-sm bbcd-d-qty" data-dilution="${i}" data-row="${idx}" step="0.01" min="0.01" placeholder="移取" style="-moz-appearance:textfield;"></td>`;
